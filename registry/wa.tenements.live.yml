# Field shape verified against the live service on 2026-09-04.
# GID WINDOWS GO STALE, AND THIS IS THE THIRD TIME, about a month after the
# second. Re-based 2026-10-23: the layer now runs 8,211,619 - 8,242,224 (30,606
# rows), roughly 1,000,000 above the 7.2M windows below, which is why the 2026-10-04
# run quarantined five windows as too_small and one as over the 10,000 cap.
# Counted before committing: 5,381 / 6,000 / 6,000 / 6,000 / 6,000 / 1,225, the last
# open-ended so growth lands there. Gids are dense (6,000 gids held 6,000 rows),
# so the windows are even. EXPECT IT AGAIN: a window written by hand against a
# number that gets reassigned is a clock, not a design. The durable fix is an
# engine feature that computes the windows from min/max at run time.
#
# THE ONE BEFORE THAT (second time): The layer was rebuilt and
# every gid reassigned: windows written for <7,150,000 .. >=7,168,000 now sit
# entirely below a range that runs 7,204,466 - 7,234,931. Four windows matched
# nothing (quarantined too_small) and the open-ended one matched all 30,466 and
# hit the 10,000 cap (quarantined contains_forbidden_text). Both failure modes
# were caught, which is the design working -- the numbers were simply old.
#
# TO RE-BASE, when it happens again:
#   .../MapServer/3/query?where=1%3D1&returnCountOnly=true&f=json
#   .../MapServer/3/query?where=1%3D1&outStatistics=[{"statisticType":"min",
#       "onStatisticField":"gid","outStatisticFieldName":"mn"}, ...max...]
# then cut the range into windows of roughly 5,000 against the 10,000 cap, and
# COUNT each one before committing to it.
#
# Not offset pagination, though the service supports it: resultRecordCount
# returns exceededTransferLimit:true on every full page, and that string is the
# gate that tells us a window is overflowing. Paginating would mean deleting the
# tripwire that found this.
source_id: wa.tenements.live
status: active  # was active; auto-disabled 2026-09-07 after 10 consecutive failures
cadence: monthly
schema_id: mining.v1

publisher: DMIRS Western Australia
publisher_tier: first_party
destroys_own_history: true   # current holdings only; the DEAD layer keeps deaths, not ownership over time
licence: "Creative Commons Attribution 4.0 (WA SLIP public services); see https://catalogue.data.wa.gov.au/dataset/mining-tenements-dmirs-003"
personal_data: parties_only

# UNPAUSED 2026-09-07, after measuring what the pause was protecting.
#
# holder1 is the analytical point: ownership of ground is overwritten in place,
# so consolidation is invisible afterwards. This is the only source in the fleet
# whose entity is an owner rather than an artifact.
#
# The pause note led with "40% of holders are named individuals". True of names;
# on a 4,000-tenement sample the split by *ground* is 92.5% corporate and 7.5%
# individual, median one tenement each. Forty percent of names, seven percent of
# ground -- the denominator this fleet insists on everywhere else.
#
# WA publishes the register under CC-BY 4.0, stated "available for use by
# everyone", with no privacy condition and explicit republication rights. The
# parser (v2) keeps corporate holders verbatim and reduces natural persons to a
# stable digest, so no derived table restates a person's name. The raw archive
# does contain them, which is why this declares parties_only rather than none.
#
# Object storage was considered and rejected as disproportionate *here*: this
# source adds ~5 MB a month and mining-pipeline's marginal growth is ~0 MB/day.
# The fleet will need object storage within months for size reasons
# (cloud-footprint first, ~10 weeks); sensitive sources should migrate then.
# See docs/ownership-is-blocked.md.

notes: >-
  Live mining tenements. The perishable fact is the holder: ownership of ground
  is overwritten in place, so consolidation is invisible after the fact. The
  companion DEAD layer (DMIRS-026) keeps 422,194 deaths back to 1883 and is
  therefore cited rather than captured — see docs/what-we-do-not-capture.md.
storage: git

